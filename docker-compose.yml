services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GITHUB_PRIVATE_KEY_PATH: /app/private-key.pem
    depends_on:
      - falkordb
    volumes:
      - ${GITHUB_PRIVATE_KEY_PATH:-./private-key.pem}:/app/private-key.pem:ro
      - falkordb_data:/data:ro

volumes:
  falkordb_data:
