<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphora — Graph Build Status</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --done: #3fb950;
      --running: #d29922;
      --pending: #58a6ff;
      --failed: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 20px; margin: 0; }
    .meta { color: var(--muted); font-size: 13px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.done    { color: var(--done);    border-color: var(--done); }
    .badge.running { color: var(--running); border-color: var(--running); }
    .badge.pending { color: var(--pending); border-color: var(--pending); }
    .badge.failed  { color: var(--failed);  border-color: var(--failed); }
    .scope { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--done); margin-right:6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  </style>
</head>
<body>
  <header>
    <h1>Graphora — Graph Build Status</h1>
    <div class="meta"><span class="dot"></span>Auto-refresh every 3s · <span id="updated">—</span></div>
  </header>

  <table>
    <thead>
      <tr>
        <th>Repository</th>
        <th>Scope</th>
        <th>Status</th>
        <th>Sources</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td class="empty" colspan="5">Loading…</td></tr>
    </tbody>
  </table>

  <script>
    function badgeClass(status) {
      const s = (status || "").toLowerCase();
      if (s.includes("done") || s.includes("ready") || s.includes("complete")) return "done";
      if (s.includes("run") || s.includes("build") || s.includes("progress")) return "running";
      if (s.includes("fail") || s.includes("error")) return "failed";
      return "pending";
    }

    function fmtTime(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    async function refresh() {
      try {
        const res = await fetch("/status", { cache: "no-store" });
        const data = await res.json();
        const builds = data.builds || [];
        const tbody = document.getElementById("rows");
        if (builds.length === 0) {
          tbody.innerHTML = '<tr><td class="empty" colspan="5">No graph builds yet. Trigger an install or open a PR.</td></tr>';
        } else {
          tbody.innerHTML = builds.map(b => `
            <tr>
              <td>${b.owner || "?"}/${b.repo || "?"}</td>
              <td class="scope">${b.graph_scope || "—"}</td>
              <td><span class="badge ${badgeClass(b.status)}">${b.status || "—"}</span></td>
              <td>${b.source_count ?? "—"}</td>
              <td>${fmtTime(b.updated_at)}</td>
            </tr>
          `).join("");
        }
        document.getElementById("updated").textContent = "as of " + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById("updated").textContent = "fetch error";
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
