<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphora — Graph Build Status</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --done: #3fb950;
      --running: #d29922;
      --pending: #58a6ff;
      --failed: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 20px; margin: 0; }
    .meta { color: var(--muted); font-size: 13px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.done    { color: var(--done);    border-color: var(--done); }
    .badge.running { color: var(--running); border-color: var(--running); }
    .badge.pending { color: var(--pending); border-color: var(--pending); }
    .badge.failed  { color: var(--failed);  border-color: var(--failed); }
    .scope { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--done); margin-right:6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    tr.build-row { cursor: pointer; }
    tr.build-row:hover td { background: #1c2330; }
    .caret { display:inline-block; width:12px; color: var(--muted); transition: transform 0.15s; }
    tr.build-row.open .caret { transform: rotate(90deg); }
    .detail td { background: #0b0f14; padding: 0; }
    .detail-inner { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .detail-inner h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .stat-grid { display: grid; grid-template-columns: auto auto; gap: 2px 16px; font-size: 13px; }
    .stat-grid .k { color: var(--muted); }
    .logs {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .files { font-size: 12px; max-height: 160px; overflow: auto; }
    .files div { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); padding: 1px 0; }
    .loading-detail { color: var(--muted); padding: 8px 0; }
    @media (max-width: 720px) { .detail-inner { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Graphora — Graph Build Status</h1>
    <div class="meta"><span class="dot"></span>Auto-refresh every 3s · <span id="updated">—</span></div>
  </header>

  <table>
    <thead>
      <tr>
        <th style="width:24px"></th>
        <th>Repository</th>
        <th>Scope</th>
        <th>Status</th>
        <th>Sources</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td class="empty" colspan="6">Loading…</td></tr>
    </tbody>
  </table>

  <script>
    const openRows = new Set();

    function badgeClass(status) {
      const s = (status || "").toLowerCase();
      if (s.includes("done") || s.includes("ready") || s.includes("complete") || s.includes("built")) return "done";
      if (s.includes("run") || s.includes("build") || s.includes("progress")) return "running";
      if (s.includes("fail") || s.includes("error")) return "failed";
      return "pending";
    }

    function fmtTime(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }

    function rowKey(b) { return `${b.owner}/${b.repo}/${b.graph_scope}`; }

    async function loadDetail(b, container) {
      const params = new URLSearchParams({ owner: b.owner, repo: b.repo, scope: b.graph_scope });
      container.innerHTML = '<div class="loading-detail">Loading details…</div>';
      try {
        const res = await fetch("/status/detail?" + params.toString(), { cache: "no-store" });
        const data = await res.json();
        const stats = data.stats || {};
        const build = data.build || {};
        const counts = stats.node_counts || {};
        const countRows = Object.keys(counts).sort().map(k => `<span class="k">${esc(k)}</span><span>${counts[k]}</span>`).join("");
        const logs = (build.logs || []).join("\n") || "No logs recorded.";
        const files = (stats.files || []);
        const filesHtml = files.length ? files.map(f => `<div>${esc(f)}</div>`).join("") : '<div class="k">No files.</div>';
        container.innerHTML = `
          <div class="detail-inner">
            <div>
              <h3>Graph stats (${esc(b.graph_scope)})</h3>
              <div class="stat-grid">
                <span class="k">Nodes total</span><span>${stats.node_total ?? "—"}</span>
                <span class="k">Relationships</span><span>${stats.relationship_count ?? "—"}</span>
                ${countRows}
              </div>
              <h3 style="margin-top:14px">Files (${files.length})</h3>
              <div class="files">${filesHtml}</div>
            </div>
            <div>
              <h3>Build log</h3>
              <div class="logs">${esc(logs)}</div>
            </div>
          </div>`;
      } catch (e) {
        container.innerHTML = '<div class="loading-detail">Failed to load details.</div>';
      }
    }

    function toggleRow(b, tr) {
      const key = rowKey(b);
      const detail = tr.nextElementSibling;
      if (openRows.has(key)) {
        openRows.delete(key);
        tr.classList.remove("open");
        detail.style.display = "none";
      } else {
        openRows.add(key);
        tr.classList.add("open");
        detail.style.display = "table-row";
        loadDetail(b, detail.querySelector(".detail-content"));
      }
    }

    async function refresh() {
      try {
        const res = await fetch("/status", { cache: "no-store" });
        const data = await res.json();
        const builds = data.builds || [];
        const tbody = document.getElementById("rows");
        tbody.innerHTML = "";
        if (builds.length === 0) {
          tbody.innerHTML = '<tr><td class="empty" colspan="6">No graph builds yet. Trigger an install or open a PR.</td></tr>';
        } else {
          builds.forEach(b => {
            const key = rowKey(b);
            const isOpen = openRows.has(key);
            const tr = document.createElement("tr");
            tr.className = "build-row" + (isOpen ? " open" : "");
            tr.innerHTML = `
              <td><span class="caret">▶</span></td>
              <td>${esc(b.owner)}/${esc(b.repo)}</td>
              <td class="scope">${esc(b.graph_scope)}</td>
              <td><span class="badge ${badgeClass(b.status)}">${esc(b.status) || "—"}</span></td>
              <td>${b.source_count ?? "—"}</td>
              <td>${fmtTime(b.updated_at)}</td>`;
            const detail = document.createElement("tr");
            detail.className = "detail";
            detail.style.display = isOpen ? "table-row" : "none";
            detail.innerHTML = '<td colspan="6"><div class="detail-content"></div></td>';
            tr.addEventListener("click", () => toggleRow(b, tr));
            tbody.appendChild(tr);
            tbody.appendChild(detail);
            if (isOpen) loadDetail(b, detail.querySelector(".detail-content"));
          });
        }
        document.getElementById("updated").textContent = "as of " + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById("updated").textContent = "fetch error";
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
