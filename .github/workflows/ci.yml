name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mcp: ["mcp>=1.0,<2", "mcp>=2,<3"]
    services:
      # Without a live FalkorDB the store/blast/CLI/MCP suites skip themselves.
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "${{ matrix.mcp }}"
      - name: Run tests (no skips allowed)
        shell: bash
        run: |
          pytest tests -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
